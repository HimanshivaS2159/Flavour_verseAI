<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsVerse AI v2.0 - Complete Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .header {
            background: rgba(10, 14, 39, 0.95);
            border-bottom: 2px solid rgba(255, 107, 53, 0.3);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
        }
        .nav-tab {
            background: rgba(255, 255, 255, 0.05);
            color: #b0b0b0;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .nav-tab:hover {
            background: rgba(255, 107, 53, 0.1);
            color: #ff6b35;
        }
        .nav-tab.active {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
            color: white;
            border-color: #ff6b35;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 30px; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .page-title { text-align: center; font-size: 2.5rem; color: #ff6b35; margin-bottom: 10px; }
        .page-subtitle { text-align: center; color: #888; margin-bottom: 40px; font-size: 1.1rem; }
        iframe { width: 100%; height: calc(100vh - 200px); border: none; border-radius: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">🏆 SportsVerse AI v2.0</div>
            <div class="nav-tabs">
                <div class="nav-tab active" onclick="showSection('sports')">🏀 Sports Analytics</div>
                <div class="nav-tab" onclick="showSection('health')">💚 Health Dashboard</div>
                <div class="nav-tab" onclick="showSection('injury')">🏃 Injury Prediction</div>
            </div>
        </div>
    </div>
    <div class="container">
        <div id="sports" class="section active">
            <iframe src="index.html"></iframe>
        </div>
        <div id="health" class="section">
            <iframe src="health.html"></iframe>
        </div>
        <div id="injury" class="section">
            <iframe src="injury.html"></iframe>
        </div>
    </div>
    <script>
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(section).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
